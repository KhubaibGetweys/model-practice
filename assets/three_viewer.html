function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// ---------------------------------------------------------------
// Building floors + procedural SWITCHBACK stairs
// Person stays planted in world space; building rotates/translates
// underneath so the current tread is always under their feet.
// Animation is 100% scroll-driven via setScrollProgress(0..1).
// ---------------------------------------------------------------
const FLOOR_SPACING = 4.2;
const SLAB_TOP_LOCAL = -1.88;
const FLOOR0_NODE_Y = -8.4;
function floorWalkY(floorIndex) {
  return FLOOR0_NODE_Y + floorIndex * FLOOR_SPACING + SLAB_TOP_LOCAL;
}

const FOOT_EPS = 0.02;
const BUILDING_ROTATION_START = 0;
const BUILDING_ROTATION_END = 360;

const CAM_OFFSET_X = 5.2;
const CAM_OFFSET_Z = 9.0;
const CAM_HEIGHT = 2.6;

// Stair well layout (building-local)
const STAIR_X = 3.15;
const STEP_W = 1.45;   // width along X
const STEP_D = 0.48;   // depth along run (Z)
const STEP_H = 0.12;   // tread thickness
const STEPS_PER_FLIGHT = 11;
const Z_EXTENT = 2.85; // run end positions ±Z
const LAND_DEPTH = 1.15;
const LAND_THICK = 0.14;
const FLIGHTS = 4;     // Floor_4 → 3 → 2 → 1 → 0

const STEP_COLOR = 0xc2a06a;
const LAND_COLOR = 0xb08955;
const RAIL_COLOR = 0x8a8f98;

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp01(x) { return Math.max(0, Math.min(1, x)); }

function lerpAngle(a, b, t) {
  let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

/** Dense walk path: one sample per tread + landing/turn samples. */
let stairPath = [];

function makeMat(color, rough = 0.82) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: rough,
    metalness: 0.04,
  });
}

function addBox(parent, mat, w, h, d, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = false;
  mesh.receiveShadow = false;
  parent.add(mesh);
  return mesh;
}

/**
 * Builds continuous switchback stairs with landings.
 * Flight 0: +Z → -Z (down). Flight 1: -Z → +Z. Alternates.
 * Returns walk path samples in building-local space.
 */
function buildSwitchbackStairs(parent) {
  const root = new THREE.Group();
  root.name = 'SwitchbackStairs';
  parent.add(root);

  const stepMat = makeMat(STEP_COLOR);
  const landMat = makeMat(LAND_COLOR, 0.78);
  const railMat = makeMat(RAIL_COLOR, 0.55);

  const path = [];

  function pushPose(x, y, z, rotY) {
    path.push({ x, y: y + FOOT_EPS, z, rotY });
  }

  function addLanding(y, zCenter, rotY) {
    addBox(root, landMat, STEP_W + 0.15, LAND_THICK, LAND_DEPTH, STAIR_X, y - LAND_THICK / 2, zCenter);
    // Short side rails on landing
    const railH = 0.75;
    addBox(root, railMat, 0.06, railH, LAND_DEPTH * 0.9, STAIR_X + STEP_W * 0.5 - 0.05, y + railH / 2, zCenter);
  }

  function addFlight(fromFloor, toFloor, zFrom, zTo, includeTopLanding) {
    const yTop = floorWalkY(fromFloor);
    const yBot = floorWalkY(toFloor);
    const facing = zTo < zFrom ? Math.PI : 0; // face travel direction (-Z or +Z)

    // Top landing only on the first flight (later flights reuse prior bottom landing).
    if (includeTopLanding) {
      addLanding(yTop, zFrom, facing);
      pushPose(STAIR_X, yTop, zFrom, facing);
    } else {
      // Step onto shared landing facing the new flight direction.
      pushPose(STAIR_X, yTop, zFrom, facing);
    }

    // Connected treads — Y drops one rise per step, Z advances along run
    for (let i = 0; i < STEPS_PER_FLIGHT; i++) {
      const t = (i + 1) / STEPS_PER_FLIGHT;
      const y = lerp(yTop, yBot, t);
      const z = lerp(zFrom, zTo, (i + 0.5) / STEPS_PER_FLIGHT);
      addBox(root, stepMat, STEP_W, STEP_H, STEP_D, STAIR_X, y - STEP_H / 2, z);
      pushPose(STAIR_X, y, z, facing);

      // Outer handrail post every other step (cheap visual continuity)
      if (i % 2 === 0) {
        addBox(root, railMat, 0.05, 0.7, 0.05, STAIR_X + STEP_W * 0.5 - 0.04, y + 0.35, z);
      }
    }

    // Bottom landing + turn samples (180°) before next flight
    const nextFacing = facing + Math.PI;
    addLanding(yBot, zTo, nextFacing);
    pushPose(STAIR_X, yBot, zTo, facing);
    for (let k = 1; k <= 6; k++) {
      pushPose(STAIR_X, yBot, zTo, lerpAngle(facing, nextFacing, k / 6));
    }
  }

  for (let f = 0; f < FLIGHTS; f++) {
    const fromFloor = 4 - f;
    const toFloor = fromFloor - 1;
    const goingNegZ = (f % 2 === 0);
    const zFrom = goingNegZ ? Z_EXTENT : -Z_EXTENT;
    const zTo = goingNegZ ? -Z_EXTENT : Z_EXTENT;
    addFlight(fromFloor, toFloor, zFrom, zTo, f === 0);
  }

  // Final exit walk on ground floor toward +Z glass
  const y0 = floorWalkY(0);
  const exitFacing = 0;
  for (let i = 1; i <= 8; i++) {
    const t = i / 8;
    pushPose(lerp(STAIR_X, 0.4, t), y0, lerp(-Z_EXTENT, 4.6, t), exitFacing);
  }

  stairPath = path;
  return root;
}

/** Sample building-local pose along the stair path from scroll progress. */
function stairLocalPose(p) {
  p = clamp01(p);
  if (!stairPath.length) {
    return { x: STAIR_X, y: floorWalkY(4) + FOOT_EPS, z: Z_EXTENT, rotY: Math.PI };
  }

  // Smooth continuous sample along the path (no per-step Y snaps —
  // those caused camera/building jerks under a fixed camera).
  const maxIdx = stairPath.length - 1;
  const f = p * maxIdx;
  const i = Math.min(Math.floor(f), maxIdx - 1);
  const localT = f - i;
  const a = stairPath[i];
  const b = stairPath[Math.min(i + 1, maxIdx)];

  return {
    x: lerp(a.x, b.x, localT),
    y: lerp(a.y, b.y, localT),
    z: lerp(a.z, b.z, localT),
    rotY: lerpAngle(a.rotY, b.rotY, localT),
  };
}

let buildingRoot = null;
let personRoot = null;
let mixer = null;
let walkClip = null, idleClip = null;
let walkAction = null, idleAction = null;
let activeAction = null;

const loader = new GLTFLoader();
let buildingReady = false;
let personReady = false;

function tryStart() {
  if (!buildingReady || !personReady) return;
  if (personRoot.parent !== scene) scene.add(personRoot);
  applyProgress(currentProgress);
}

loader.parse(base64ToArrayBuffer(BUILDING_B64), '', (gltf) => {
  buildingRoot = gltf.scene.getObjectByName('Building_Root') || gltf.scene;
  scene.add(gltf.scene);

  // Hide original floating platform stairs / rails — replaced below.
  buildingRoot.traverse((o) => {
    const name = o.name || '';
    const parentName = (o.parent && o.parent.name) || '';
    if (/Stairs|Handrail/i.test(name) || /Stairs|Handrail/i.test(parentName)) {
      o.visible = false;
    }
  });

  // Soften outer room shells so walker stays readable while building spins.
  buildingRoot.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    const parentName = (o.parent && o.parent.name) || '';
    if (/Slab|Glass|Roof|Switchback/i.test(parentName)) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m) return;
      m.transparent = true;
      m.opacity = 0.28;
      m.depthWrite = false;
    });
  });

  buildSwitchbackStairs(buildingRoot);

  buildingReady = true;
  tryStart();
});

loader.parse(base64ToArrayBuffer(PERSON_B64), '', (gltf) => {
  personRoot = gltf.scene;
  scene.add(personRoot);

  mixer = new THREE.AnimationMixer(personRoot);
  walkClip = THREE.AnimationClip.findByName(gltf.animations, 'Walk');
  idleClip = THREE.AnimationClip.findByName(gltf.animations, 'Idle');
  walkAction = mixer.clipAction(walkClip);
  idleAction = mixer.clipAction(idleClip);
  [walkAction, idleAction].forEach((a) => { a.play(); a.paused = true; });
  activeAction = walkAction;

  personReady = true;
  tryStart();
});

function scrubAction(action, clip, timeFraction) {
  if (!action || !clip) return;
  if (activeAction !== action) {
    if (activeAction) activeAction.weight = 0;
    action.weight = 1;
    activeAction = action;
  }
  action.time = clamp01(timeFraction) * clip.duration;
}

let currentProgress = 0;
let lastScrollUpdate = performance.now();

// Display state (smoothed). Targets are set from scroll; tick() eases toward them
// so scroll jitter / path discontinuities don't jerk the camera view.
let targetProgress = 0;
let smoothPose = { x: STAIR_X, y: floorWalkY(4) + FOOT_EPS, z: Z_EXTENT, rotY: Math.PI };
let smoothRad = 0;
let smoothInitialized = false;
const SMOOTH_SPEED = 14; // higher = snappier follow, still removes micro-jerks

const CAM_POS = new THREE.Vector3(CAM_OFFSET_X, 1.2 + CAM_HEIGHT - 1.2, CAM_OFFSET_Z);
const CAM_LOOK = new THREE.Vector3(0, 1.2, 0);

function applyBuildingFromPose(pose, rad) {
  if (!buildingRoot) return;
  buildingRoot.rotation.y = rad;
  const c = Math.cos(rad);
  const s = Math.sin(rad);
  const wx = pose.x * c + pose.z * s;
  const wz = -pose.x * s + pose.z * c;
  buildingRoot.position.set(-wx, -pose.y, -wz);

  if (personRoot) {
    personRoot.position.set(0, FOOT_EPS, 0);
    personRoot.rotation.y = pose.rotY + rad;
  }
}

function applyProgress(p) {
  currentProgress = clamp01(p);
  targetProgress = currentProgress;

  // Scrub walk immediately so feet stay in sync with scroll direction.
  const walkFraction = currentProgress % 1;
  scrubAction(walkAction, walkClip, walkFraction);
  if (mixer) mixer.update(0);
}

window.setScrollProgress = function (p) {
  lastScrollUpdate = performance.now();
  applyProgress(p);
};

let idleClock = 0;
let lastFrame = performance.now();

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  // Ease building/person toward the scroll target (kills camera jerk).
  const targetPose = stairLocalPose(targetProgress);
  const targetRad = THREE.MathUtils.degToRad(
    lerp(BUILDING_ROTATION_START, BUILDING_ROTATION_END, targetProgress)
  );

  if (!smoothInitialized) {
    smoothPose = { ...targetPose };
    smoothRad = targetRad;
    smoothInitialized = true;
  } else {
    const k = 1 - Math.exp(-SMOOTH_SPEED * dt);
    smoothPose.x = lerp(smoothPose.x, targetPose.x, k);
    smoothPose.y = lerp(smoothPose.y, targetPose.y, k);
    smoothPose.z = lerp(smoothPose.z, targetPose.z, k);
    smoothPose.rotY = lerpAngle(smoothPose.rotY, targetPose.rotY, k);
    smoothRad = lerp(smoothRad, targetRad, k);
  }

  applyBuildingFromPose(smoothPose, smoothRad);

  // Camera is locked — never jumps with stair samples.
  camera.position.copy(CAM_POS);
  camera.lookAt(CAM_LOOK);

  if (now - lastScrollUpdate > 150 && idleAction && idleClip) {
    idleClock += dt;
    scrubAction(idleAction, idleClip, (idleClock % idleClip.duration) / idleClip.duration);
    if (mixer) mixer.update(0);
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
</script>
